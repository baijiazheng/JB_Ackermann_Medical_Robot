# ============================================================
# setup.cfg —— ament_python 包的必需文件
#
# 【为什么必须有这个文件】
#   ROS2 的可执行文件（ros2 run 用的）不在标准的 bin/ 里，
#   而是装在 lib/<包名>/ 下。这个文件就是告诉安装系统：
#     "把脚本装到 $base/lib/jb_camera_test 这个目录"
#   少了它，colcon build 会"成功"，但 ros2 run 报 No executable found。
#
#   ★ 这个坑很常见 —— 编译不报错，运行才失败。
# ============================================================

[develop]
# 开发模式（--symlink-install）：脚本软链到 lib 目录
script_dir=$base/lib/jb_camera_test

[install]
# 正常安装：脚本拷到 lib 目录
install_scripts=$base/lib/jb_camera_test
